name: jws
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.7.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  dart_pusher_channels: ^1.2.3
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_tabler_icons: ^1.43.0
  go_router: ^17.2.3
  hijri: ^3.0.1
  intl: ^0.20.3
  path_provider: ^2.1.5
  sticky_headers: ^0.3.0+2
  webview_flutter: ^4.13.1
  # Dependensi khusus Tizen OS (Smart TV Samsung)
  audioplayers_tizen: any
  connectivity_plus_tizen: any
  flutter_secure_storage_tizen: any
  path_provider_tizen: any
  webview_flutter_tizen: any
  sqflite_tizen: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/
    - assets/sounds/
    - assets/adzan/
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/icon-jws-kominfo.png"
